    cannot establish a real user's subjective experience. If no human feedback
    was collected, say so when relevant rather than inventing it or adding a
    routine gate. Reuse an existing investigation, review, task note, ticket, or
    handoff for observations with descriptive references to the checked
    behavior. Optional durable documentation follows features.documentation and
    existing paths; when disabled, create no optional observation document but
    keep the handoff accurate. External records follow features.planning and
    existing access/authorization rules. Preserve an observation's original
    tested context when relevant behavior changes, identify it as historical,
    and assess whether the changed behavior needs another check. Keep
    observation, change approval, and release authorization distinct. Positive
    feedback does not authorize unrelated scope or publication. Human
    involvement follows concrete verification needs and project policy; routine
    sufficiently verified authorized work proceeds independently. Discovery
    findings use existing investigation records without fabricated product ACs
    or execution evidence. For existing manual execution results, reason can
    contain a concise observation or descriptive reference. Preserve the
    version-1 report contract: scenario identities, configured test types,
    scope, revision freshness, and manual-verification warnings still apply. A
    durable historical observation does not satisfy current revision-bound
    evidence. Never replace automated failures with a manual claim or report an
    unperformed check as passed. These instructions cannot authenticate feedback
    or establish automated proof. Read contextSelection.mode (default guided).
    When off, request no extra context-selection pass or handoff. When guided,
    first resolve the learning policy and its separate index-first gate, then
    read .cliewen-openspec/context-selection.md for native-first selection. This
    setting is independent of planning and documentation maintenance and does
    not disable required native spec reading or change learning gates. Read
    .cliewen-openspec/planning.md for optional planning guidance;
    features.planning controls its planning-specific requests. For relevant
    integration/review work with ciInspection configured and enabled, read
    .cliewen-openspec/ci-inspection.md for advisory host inspection; this adds
    no integration authorization. Review and close the investigation or prepare
    its handoff. This workflow does not authorize production implementation.
    Review sources, actual experiment observations, unresolved uncertainty,
    recommendation, and human decision status. Preserve proposed status until a
    human agrees. It is valid to end with no code change. If delivery is agreed,
    create a separate cliewen-delivery change and link the investigation and
    decision. Before archive, preserve useful durable knowledge and resolve any
    temporary experiment cleanup. Use OpenSpec archive with --skip-specs after
    human review when no product spec deltas are intended. Cliewen check
    --change on a discovery change checks installation and registry health only
    and reports discovery-review-required; it does not validate investigation
    completeness or product test evidence. Before and after native OpenSpec
    archive, read .cliewen-openspec/closure.md and apply its investigation
    guidance and existing feature settings."
