name: Deploy project site
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      organization_ready: ${{ steps.organization.outputs.ready }}
    env:
      OPENSPEC_TELEMETRY: '0'
      CI: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
      - run: npm run docs:check
      - run: node scripts/build-guide-redirects.mjs
      - run: node scripts/check-organization-site.mjs
      - name: Keep the existing site until the new guide is live
        id: organization
        run: |
          if curl --silent --fail https://cliewen-openspec.github.io/guide/getting-started.html > /dev/null; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.organization.outputs.ready == 'true'
        with:
          path: legacy-site-dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.organization_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Check published guide paths
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL}"
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/getting-started.html"
