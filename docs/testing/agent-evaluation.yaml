      wallTimeSeconds: 600
      outputBytes: 67108864
      reportedCostUSD: 2
      tokenLimit: null
      billing: per phase; existing subscription; reported list-equivalent cost is not an invoice
    traceFormat: Claude stream-json with verbose events plus stderr
  codex-guide-walkthrough:
    readiness: pinned
    agent: Codex CLI
    runner: cli
    model: gpt-6.1-sol
    agentVersion: 0.166.0
    provider: openai; existing ChatGPT CLI authentication
    effort: medium
    permissions: local shell with approval never; multi_agent disabled; project scope is instructional, not OS isolation
    context: new ephemeral process; user config and rules ignored; retrospective receives only this trial's saved observations; managed/global instructions may remain
